{% extends 'shop/base.html' %}
{% block extra_css %}{{ super() }}<link rel="stylesheet" href="{{ url_for('static', filename='css/support.css') }}">{% endblock %}
{% block content %}<div class="account-layout">{% include 'shop/_account_sidebar.html' %}<div class="account-content"><section class="panel"><h1>Gửi yêu cầu hỗ trợ</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="subject">Chủ đề</label><input id="subject" class="form-control mb-3" name="subject" maxlength="150" required><label for="category">Danh mục</label><select id="category" class="form-select mb-3" name="category"><option value="Đơn hàng">Đơn hàng</option><option value="Kỹ thuật">Kỹ thuật</option><option value="Thanh toán">Thanh toán</option><option value="Bảo hành">Bảo hành</option><option value="Khác">Khác</option></select><label for="order">Đơn hàng liên quan (tùy chọn)</label><select id="order" class="form-select mb-3" name="order_id"><option value="">Không gắn đơn hàng</option>{% for order in orders %}<option value="{{ order.id }}">{{ order.order_code }}</option>{% endfor %}</select><label for="body">Nội dung (không gửi mật khẩu/mã xác thực)</label><textarea id="body" class="form-control mb-3" name="body" maxlength="2000" rows="6" required></textarea><button class="btn btn-primary">Gửi yêu cầu</button></form></section></div></div>{% endblock %}
