{% extends 'shop/base.html' %}
{% block content %}<section class="panel"><h1>Gửi yêu cầu hỗ trợ</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="subject">Chủ đề</label><input id="subject" class="form-control mb-3" name="subject" maxlength="150" required><label for="order">Đơn hàng liên quan (tùy chọn)</label><select id="order" class="form-select mb-3" name="order_id"><option value="">Không gắn đơn hàng</option>{% for order in orders %}<option value="{{ order.id }}">{{ order.order_code }}</option>{% endfor %}</select><label for="body">Nội dung (không gửi mật khẩu/mã xác thực)</label><textarea id="body" class="form-control mb-3" name="body" maxlength="2000" rows="6" required></textarea><button class="btn btn-primary">Gửi yêu cầu</button></form></section>{% endblock %}
