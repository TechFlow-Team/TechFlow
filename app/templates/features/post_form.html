{% extends 'layouts/staff.html' %}
{% block workspace_content %}<section class="ws-panel"><h1>{{ 'Sửa bài viết' if post else 'Soạn bài viết' }}</h1><p>Nội dung văn bản thuần; xuống dòng được giữ khi hiển thị. Staff chỉ lưu nháp, Admin duyệt đăng.</p><form method="post" enctype="multipart/form-data" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-8"><label for="title">Tiêu đề</label><input class="form-control" id="title" name="title" maxlength="200" value="{{ post.title if post else '' }}" required></div><div class="col-md-4"><label for="slug">Slug (không dấu)</label><input class="form-control" id="slug" name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="200" value="{{ post.slug if post else '' }}" required></div><div class="col-12"><label for="body">Nội dung</label><textarea class="form-control" id="body" name="body" rows="15" maxlength="50000" required>{{ post.body if post else '' }}</textarea></div>
<div class="col-md-6"><label for="cover">Ảnh bìa (JPEG/PNG/WebP, tối đa 6 MB)</label><input class="form-control" id="cover" type="file" name="cover" accept="image/jpeg,image/png,image/webp">{% if post and post.cover_url %}<img class="img-thumbnail feature-cover" src="{{ post.cover_url|product_image }}" alt="Ảnh bìa hiện tại"><label><input type="checkbox" name="remove_cover" value="1"> Bỏ ảnh bìa</label>{% endif %}</div><div class="col-md-6"><label for="products">Sản phẩm liên quan (tối đa 10)</label><select class="form-select" id="products" name="products" multiple size="6">{% for p in products %}<option value="{{ p.id }}" {% if post and p in post.products %}selected{% endif %}>{{ p.sku }} · {{ p.name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label for="status">Trạng thái</label><select class="form-select" id="status" name="status">{% for value,label in post_labels.items() %}{% if current_user.role == 'admin' or value == 'draft' %}<option value="{{ value }}" {% if post and post.status == value %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Lưu bài</button> <a href="{{ url_for('content.manage') }}">Quay lại</a></div></form></section>{% endblock %}
